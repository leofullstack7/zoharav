<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract office window grid at night overlooking a skyline, suggesting a private office">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#17171c"/>
<stop offset="50%" stop-color="#0e0e12"/>
<stop offset="100%" stop-color="#07070a"/>
</linearGradient>
<radialGradient id="glow" cx="38%" cy="30%" r="55%">
<stop offset="0%" stop-color="#d5dee8" stop-opacity="0.14"/>
<stop offset="60%" stop-color="#8d9bab" stop-opacity="0.04"/>
<stop offset="100%" stop-color="#17171c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="75%">
<stop offset="55%" stop-color="#000" stop-opacity="0"/>
<stop offset="100%" stop-color="#000" stop-opacity="0.44"/>
</radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="30"/>
</filter>
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.4"/>
</filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
<g stroke="#5c6876" stroke-opacity="0.35" stroke-width="2" filter="url(#ds)">
<line x1="0" y1="0" x2="0" y2="0"/>
<line x1="200" y1="0" x2="200" y2="1000"/>
<line x1="600" y1="0" x2="600" y2="1000"/>
<line x1="1000" y1="0" x2="1000" y2="1000"/>
<line x1="1400" y1="0" x2="1400" y2="1000"/>
<line x1="0" y1="140" x2="1600" y2="140"/>
<line x1="0" y1="340" x2="1600" y2="340"/>
<line x1="0" y1="540" x2="1600" y2="540"/>
</g>
<g fill="#f5f8fc">
<rect x="230" y="40" width="40" height="60" opacity="0.1"/>
<rect x="640" y="180" width="40" height="60" opacity="0.16"/>
<rect x="1040" y="60" width="40" height="60" opacity="0.08"/>
<rect x="1440" y="220" width="40" height="60" opacity="0.14"/>
<rect x="260" y="380" width="40" height="60" opacity="0.12"/>
<rect x="1080" y="400" width="40" height="60" opacity="0.1"/>
