<path d="M0 820 L160 760 L340 800 L540 720 L760 790 L980 730 L1180 780 L1380 740 L1600 800 L1600 1000 L0 1000 Z" fill="#17171c"/>
</g>
<g opacity="0.4" filter="url(#ds)">
<path d="M0 880 L220 840 L460 870 L700 820 L940 865 L1180 830 L1400 870 L1600 850 L1600 1000 L0 1000 Z" fill="#2a2a31"/>
</g>
<rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
