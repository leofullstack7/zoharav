<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract single leaf line mark on a soft silver field">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#17171c"/>
<stop offset="50%" stop-color="#0e0e12"/>
<stop offset="100%" stop-color="#07070a"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="42%" r="48%">
<stop offset="0%" stop-color="#1fa37a" stop-opacity="0.12"/>
<stop offset="60%" stop-color="#8d9bab" stop-opacity="0.04"/>
<stop offset="100%" stop-color="#17171c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="72%">
<stop offset="55%" stop-color="#000" stop-opacity="0"/>
<stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
</radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="34"/>
</filter>
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
</filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
<ellipse cx="800" cy="620" rx="200" ry="44" fill="#1fa37a" opacity="0.1" filter="url(#soft)"/>
<g filter="url(#ds)">
<path d="M800 650 C 680 610, 630 500, 680 380 C 760 420, 820 480, 820 560 C 820 600, 810 630, 800 650 Z" fill="#17171c" stroke="#d5dee8" stroke-opacity="0.5" stroke-width="2.5"/>
<path d="M690 400 C 740 450, 790 520, 800 620" fill="none" stroke="#1fa37a" stroke-opacity="0.4" stroke-width="2"/>
</g>
<line x1="800" y1="650" x2="800" y2="700" stroke="#8d9bab" stroke-opacity="0.4" stroke-width="3" filter="url(#ds)"/>
<rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
