<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract single faceted gem mark on a soft silver field">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#17171c"/>
<stop offset="50%" stop-color="#0e0e12"/>
<stop offset="100%" stop-color="#07070a"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="42%" r="48%">
<stop offset="0%" stop-color="#1fa37a" stop-opacity="0.09"/>
<stop offset="60%" stop-color="#8d9bab" stop-opacity="0.04"/>
<stop offset="100%" stop-color="#17171c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="72%">
<stop offset="55%" stop-color="#000" stop-opacity="0"/>
<stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
</radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="34"/>
</filter>
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity="0.44"/>
</filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
<ellipse cx="800" cy="610" rx="150" ry="36" fill="#0f6b4f" opacity="0.1" filter="url(#soft)"/>
<g filter="url(#ds)">
<polygon points="800,380 920,460 870,620 730,620 680,460" fill="#17171c" stroke="#d5dee8" stroke-opacity="0.55" stroke-width="2.5"/>
<polygon points="800,380 920,460 800,500" fill="#8d9bab" opacity="0.4"/>
<polygon points="800,380 680,460 800,500" fill="#2a2a31" opacity="0.6"/>
<polygon points="680,460 730,620 800,500" fill="#0f6b4f" opacity="0.15"/>
<polygon points="920,460 870,620 800,500" fill="#1fa37a" opacity="0.14"/>
<polygon points="730,620 870,620 800,500" fill="#0e0e12" opacity="0.7"/>
<line x1="800" y1="380" x2="800" y2="500" stroke="#f5f8fc" stroke-opacity="0.4" stroke-width="1.5"/>
</g>
<rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
