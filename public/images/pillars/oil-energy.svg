<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract triangular derrick frame mark on a soft silver field">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#17171c"/>
<stop offset="50%" stop-color="#0e0e12"/>
<stop offset="100%" stop-color="#07070a"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="40%" r="50%">
<stop offset="0%" stop-color="#f5f8fc" stop-opacity="0.2"/>
<stop offset="60%" stop-color="#8d9bab" stop-opacity="0.05"/>
<stop offset="100%" stop-color="#17171c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="72%">
<stop offset="55%" stop-color="#000" stop-opacity="0"/>
<stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
</radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="36"/>
</filter>
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity="0.42"/>
</filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
<line x1="0" y1="740" x2="1600" y2="740" stroke="#8d9bab" stroke-opacity="0.2" stroke-width="2"/>
<ellipse cx="800" cy="700" rx="230" ry="50" fill="#d5dee8" opacity="0.1" filter="url(#soft)"/>
<g fill="none" stroke="#d5dee8" filter="url(#ds)">
<path d="M740 740 L800 320 L860 740" stroke-width="4" opacity="0.6"/>
<line x1="760" y1="620" x2="840" y2="620" stroke-width="2.5" opacity="0.5"/>
<line x1="752" y1="500" x2="848" y2="500" stroke-width="2.5" opacity="0.5"/>
<line x1="775" y1="400" x2="825" y2="400" stroke-width="2" opacity="0.5"/>
<line x1="746" y1="680" x2="834" y2="680" stroke-width="2" opacity="0.4"/>
</g>
<circle cx="800" cy="320" r="7" fill="#f5f8fc" opacity="0.7"/>
<circle cx="800" cy="320" r="20" fill="#f5f8fc" opacity="0.15" filter="url(#soft)"/>
<rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
