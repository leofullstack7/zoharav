<g stroke="#d5dee8" stroke-opacity="0.5" stroke-width="2.5" filter="url(#ds)">
<line x1="1080" y1="360" x2="1030" y2="380"/>
<line x1="1080" y1="360" x2="1062" y2="412"/>
