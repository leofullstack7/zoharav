<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract ascending ribbon line mark on a soft silver field">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#17171c"/>
<stop offset="50%" stop-color="#0e0e12"/>
<stop offset="100%" stop-color="#07070a"/>
</linearGradient>
<radialGradient id="glow" cx="58%" cy="36%" r="50%">
<stop offset="0%" stop-color="#f5f8fc" stop-opacity="0.2"/>
<stop offset="60%" stop-color="#8d9bab" stop-opacity="0.05"/>
<stop offset="100%" stop-color="#17171c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="72%">
<stop offset="55%" stop-color="#000" stop-opacity="0"/>
<stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
</radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
