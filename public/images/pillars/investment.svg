</filter>
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
</filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
<line x1="500" y1="700" x2="1100" y2="700" stroke="#8d9bab" stroke-opacity="0.2" stroke-width="2"/>
<ellipse cx="800" cy="500" rx="260" ry="90" fill="#d5dee8" opacity="0.1" filter="url(#soft)"/>
<g fill="none" filter="url(#ds)">
<path d="M520 660 L640 580 L760 610 L900 460 L1080 360" stroke="#8d9bab" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
<path d="M520 660 L640 580 L760 610 L900 460 L1080 360" stroke="#f5f8fc" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</g>
<g fill="#f5f8fc" opacity="0.6">
<circle cx="520" cy="660" r="5"/>
<circle cx="640" cy="580" r="5"/>
<circle cx="760" cy="610" r="5"/>
<circle cx="900" cy="460" r="5"/>
<circle cx="1080" cy="360" r="6"/>
