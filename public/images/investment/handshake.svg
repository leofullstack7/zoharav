<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract converging arcs meeting at a point, suggesting partnership and agreement">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#17171c"/>
<stop offset="50%" stop-color="#0e0e12"/>
<stop offset="100%" stop-color="#07070a"/>
</linearGradient>
<radialGradient id="glow" cx="50%" cy="46%" r="50%">
<stop offset="0%" stop-color="#f5f8fc" stop-opacity="0.2"/>
<stop offset="60%" stop-color="#8d9bab" stop-opacity="0.05"/>
<stop offset="100%" stop-color="#17171c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="75%">
<stop offset="55%" stop-color="#000" stop-opacity="0"/>
<stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
</radialGradient>
<filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="36"/>
</filter>
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.4"/>
</filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
<g stroke="#8d9bab" stroke-opacity="0.12" stroke-width="1.5">
<line x1="260" y1="760" x2="260" y2="640"/>
<line x1="380" y1="760" x2="380" y2="560"/>
<line x1="500" y1="760" x2="500" y2="600"/>
<line x1="1100" y1="760" x2="1100" y2="580"/>
<line x1="1220" y1="760" x2="1220" y2="640"/>
<line x1="1340" y1="760" x2="1340" y2="610"/>
</g>
<ellipse cx="800" cy="500" rx="150" ry="70" fill="#f5f8fc" opacity="0.16" filter="url(#soft)"/>
<g fill="none" filter="url(#ds)">
<path d="M260 470 C 470 440, 640 460, 790 500" stroke="#d5dee8" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
<path d="M1340 470 C 1130 440, 960 460, 810 500" stroke="#d5dee8" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
</g>
<g fill="none" filter="url(#ds)">
<path d="M260 470 C 470 440, 640 460, 790 500" stroke="#f5f8fc" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
<path d="M1340 470 C 1130 440, 960 460, 810 500" stroke="#f5f8fc" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
</g>
<circle cx="800" cy="500" r="9" fill="#f5f8fc" opacity="0.8"/>
<circle cx="800" cy="500" r="22" fill="#f5f8fc" opacity="0.14" filter="url(#soft)"/>
<rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
