<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract coastal skyline of slender towers with soft water reflections, suggesting Miami">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#17171c"/>
<stop offset="50%" stop-color="#0e0e12"/>
<stop offset="100%" stop-color="#07070a"/>
</linearGradient>
<radialGradient id="glow" cx="60%" cy="38%" r="48%">
<stop offset="0%" stop-color="#f5f8fc" stop-opacity="0.2"/>
<stop offset="60%" stop-color="#8d9bab" stop-opacity="0.06"/>
<stop offset="100%" stop-color="#17171c" stop-opacity="0"/>
</radialGradient>
<radialGradient id="vig" cx="50%" cy="50%" r="75%">
<stop offset="55%" stop-color="#000" stop-opacity="0"/>
<stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
</radialGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="34"/>
</filter>
<filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
</filter>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<rect width="1600" height="1000" fill="url(#glow)"/>
<line x1="0" y1="660" x2="1600" y2="660" stroke="#8d9bab" stroke-opacity="0.22" stroke-width="2"/>
<ellipse cx="930" cy="660" rx="380" ry="50" fill="#d5dee8" opacity="0.1" filter="url(#soft)"/>
<g fill="#5c6876" opacity="0.55" filter="url(#ds)">
<rect x="300" y="520" width="14" height="140"/>
<rect x="330" y="470" width="18" height="190"/>
<rect x="365" y="540" width="12" height="120"/>
<rect x="400" y="430" width="22" height="230"/>
<rect x="440" y="500" width="14" height="160"/>
<rect x="470" y="460" width="16" height="200"/>
<rect x="505" y="560" width="12" height="100"/>
<rect x="540" y="410" width="26" height="250"/>
<rect x="585" y="490" width="16" height="170"/>
<rect x="620" y="530" width="14" height="130"/>
<rect x="655" y="450" width="18" height="210"/>
<rect x="700" y="505" width="14" height="155"/>
<rect x="735" y="395" width="24" height="265"/>
<rect x="778" y="475" width="16" height="185"/>
<rect x="815" y="545" width="12" height="115"/>
<rect x="850" y="455" width="18" height="205"/>
</g>
<g stroke="#b7c4d4" stroke-opacity="0.12" stroke-width="1">
<line x1="260" y1="700" x2="920" y2="700"/>
<line x1="280" y1="730" x2="900" y2="730"/>
<line x1="300" y1="762" x2="880" y2="762"/>
</g>
<rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
